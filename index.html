<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRI:CULTURE — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#f8f8fb;font-family:'Freesentation',Arial,sans-serif}
@font-face{font-family:'Freesentation';src:local('Freesentation Regular'),local('Freesentation'),url('./Freesentation-4Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Freesentation';src:local('Freesentation Bold'),url('./Freesentation-7Bold.ttf') format('truetype');font-weight:700;font-display:swap}
button{font:inherit}.viewport{position:fixed;inset:0;overflow:hidden}.home{position:absolute;width:1600px;height:900px;left:0;top:0;transform-origin:0 0;isolation:isolate;background:#f8f8fb;overflow:hidden}
#mapCanvas{position:absolute;inset:0;width:1600px;height:900px;z-index:-2;pointer-events:none}.soft-light{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,.13) 56%,rgba(255,255,255,.3))}
.brand{position:absolute;left:84px;top:280px;margin:0;color:#050505;font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-size:154px;font-weight:400;line-height:1.02;letter-spacing:-.025em;pointer-events:none;user-select:none}.brand span{display:block;white-space:nowrap}
.menu-circle{position:absolute;display:flex;align-items:center;justify-content:center;width:186px;height:186px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(204,204,210,.34);box-shadow:inset 0 1px 2px rgba(255,255,255,.85),0 8px 32px rgba(45,50,80,.08);backdrop-filter:blur(14px) saturate(145%);-webkit-backdrop-filter:blur(14px) saturate(145%);color:#050505;cursor:pointer;transition:background .28s ease,box-shadow .28s ease}
.menu-circle.learn{left:1280px;top:236px}.menu-circle.quiz{left:1280px;top:454px}.menu-circle.try{left:1130px;top:628px}
.menu-circle.learn .number{transform:translate(-39px,-35px)}.menu-circle.quiz .number{transform:translate(38px,27px)}.menu-circle.try .number{transform:translate(-26px,43px)}.menu-circle .number{font-family:'Anton',Impact,sans-serif;font-size:133px;line-height:1;transition:opacity .25s ease,transform .25s ease}.menu-circle .word{font-family:'Freesentation',Arial,sans-serif;font-weight:700;font-size:39px;letter-spacing:-.045em;position:absolute;opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease}
.menu-circle:hover,.menu-circle:focus-visible{background:rgba(255,255,255,.48);box-shadow:inset 0 1px 2px rgba(255,255,255,.95),0 12px 36px rgba(40,60,100,.14)}.menu-circle:hover .number,.menu-circle:focus-visible .number{opacity:0;transform:scale(.86)}.menu-circle:hover .word,.menu-circle:focus-visible .word{opacity:1;transform:translateY(0)}
.top-tools{position:absolute;right:66px;top:60px;display:flex;gap:14px}.small-circle{width:51px;height:51px;border-radius:50%;border:1px solid rgba(255,255,255,.65);background:rgba(210,210,215,.4);box-shadow:inset 0 1px 2px rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hint{display:none}@media(prefers-reduced-motion:reduce){.menu-circle,.menu-circle .number,.menu-circle .word{transition:none}}


#learnPage{position:absolute;inset:0;background:#fff;z-index:10;display:none;font-family:'Freesentation',Arial,sans-serif}
#learnPage.is-visible{display:block}
.learn-controls{position:absolute;left:60px;top:60px;display:flex;gap:15px}
.learn-controls button{width:51px;height:51px;border-radius:50%;border:1px solid #fff9;background:#d5d5d5bb;backdrop-filter:blur(12px);color:#050505;cursor:pointer;font-size:23px}
.learn-title{position:absolute;top:108px;left:0;right:0;text-align:center;margin:0;font:700 43px 'Freesentation',Arial,sans-serif;color:#050505}
.learn-grid{position:absolute;left:198px;right:195px;top:215px;display:grid;grid-template-columns:590px 1fr;column-gap:82px;align-items:center}
.city-orb{display:block;position:relative;width:570px;height:570px;border-radius:50%;border:0;padding:0;cursor:crosshair;overflow:hidden;background:#c5d9ee;box-shadow:0 0 0 1px #ddd5}
.city-orb canvas{display:block;width:100%;height:100%;border-radius:50%}
.city-orb:focus-visible{outline:4px solid #ff00bb;outline-offset:6px}
.orb-help{font:700 16px 'Freesentation',sans-serif;color:#050505;text-align:center;margin-top:13px}
.learn-copy{font:400 20.5px/1.58 'Freesentation',Arial,sans-serif;color:#050505;letter-spacing:-.025em;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.learn-copy p{margin:0 0 31px}.learn-copy p:last-child{margin-bottom:0}
.country-arrow{position:absolute;top:455px;width:68px;height:95px;border:0;background:transparent;cursor:pointer;z-index:3}
.country-arrow.prev{left:40px}.country-arrow.next{right:40px}
.country-arrow::before{content:'';display:block;width:41px;height:41px;border-left:9px solid #d4d4d4;border-bottom:9px solid #d4d4d4;border-radius:4px;transform:rotate(45deg);margin-left:15px}
.country-arrow.next::before{transform:rotate(225deg);margin-left:0}
.country-arrow:hover::before{border-color:#050505}
#sphereModal{position:absolute;inset:0;background:#0b1021ed;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:25}
#sphereModal.open{display:flex}
#sphereModal .city-orb{width:710px;height:710px;cursor:crosshair}
.modal-close{position:absolute;top:34px;right:43px;color:white;border:0;background:none;font-size:46px;cursor:pointer}
.modal-label{color:#fff;font:700 19px 'Freesentation',sans-serif;margin-top:14px}

#quizPage{display:none;position:absolute;inset:0;z-index:15;background:#fff;color:#080808;font-family:'Freesentation',sans-serif}
#quizPage.visible{display:block}
.quiz-top-left,.quiz-top-right{position:absolute;top:60px;display:flex;gap:14px;z-index:4}
.quiz-top-left{left:60px}.quiz-top-right{right:66px}
.quiz-dot{width:51px;height:51px;border:0;border-radius:50%;background:#d6d6d6bb;cursor:pointer}
.quiz-top-right .quiz-dot{cursor:default}
.quiz-intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;pointer-events:none}
.quiz-intro h2{font:700 43px/1.42 'Freesentation',sans-serif;text-align:center;margin:0 0 39px;word-break:keep-all}
.quiz-pill{background:#f5f5f5;border:1px solid #f0f0f0;box-shadow:0 2px 3px #00000013;border-radius:40px;padding:11px 42px;min-width:158px;font:700 29px 'Freesentation',sans-serif;color:#050505;cursor:pointer;pointer-events:auto}
.quiz-pill:hover{background:#e8e8e8}
#quizReveal{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;z-index:1}
.quiz-playing{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.quiz-playing.visible{display:flex}
.quiz-question{font:700 44px 'Freesentation',sans-serif;margin:105px 0 31px}
.quiz-image{width:820px;height:470px;background:#d8d8d8;display:flex;align-items:center;justify-content:center;color:#b0b0b0;font:700 32px 'Freesentation',sans-serif}
.quiz-progress{position:absolute;left:60px;bottom:55px;font:400 20px 'Freesentation',sans-serif;color:#888}
.quiz-select{position:relative;width:950px;height:74px;margin-top:27px;touch-action:none}
.quiz-track{position:absolute;top:16px;left:0;right:0;height:4px;border-radius:4px;background:#dedede}
.quiz-knob{position:absolute;top:2px;left:0;width:32px;height:32px;border-radius:50%;background:#efefef;box-shadow:0 2px 6px #0001;transform:translateX(-50%);cursor:grab;touch-action:none}
.quiz-knob:active{cursor:grabbing}
.quiz-choices{position:absolute;left:0;right:0;top:39px;display:flex;justify-content:space-between;font:700 20px 'Freesentation',sans-serif}
.quiz-choices label{cursor:pointer;min-width:110px;text-align:center}
.quiz-choices label:first-child{text-align:left}.quiz-choices label:last-child{text-align:right}
.quiz-next{margin-top:15px}
.quiz-count{position:absolute;right:65px;bottom:55px;font:400 20px 'Freesentation',sans-serif;color:#777}

/* QUIZ / V9 — thermal neon treatment */
.quiz-image{width:900px;height:540px;max-width:none;overflow:hidden;background:#d8d8d8;position:relative}
.quiz-image canvas{width:100%;height:100%;display:block}
.quiz-question{margin:91px 0 19px;font-size:40px}
.quiz-select{margin-top:20px}
.quiz-next{margin-top:10px}
.quiz-import{position:absolute;left:50%;top:565px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;flex-direction:column;pointer-events:auto}
.quiz-import button{font:700 17px 'Freesentation',sans-serif;background:#f0f0f0;border:1px solid #ddd;border-radius:24px;padding:11px 23px;cursor:pointer;color:#111}
.quiz-import p{margin:0;text-align:center;font:400 15px/1.45 'Freesentation',sans-serif;color:#777}
.quiz-intro h2{margin-bottom:32px}
.quiz-status{position:absolute;top:615px;left:0;right:0;text-align:center;font:400 16px 'Freesentation',sans-serif;color:#666;z-index:3;pointer-events:none}
.quiz-image .image-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#777;font:400 19px 'Freesentation',sans-serif}

/* TRI extensions: added screens, no changes to original HOME / LEARN content */
.tri-screen{position:absolute;inset:0;z-index:35;background:#fff;display:none;color:#080808;font-family:'Freesentation',Arial,sans-serif}
.tri-screen.visible{display:block}
.tri-screen .tri-top{position:absolute;top:34px;left:40px;right:40px;display:flex;justify-content:space-between;z-index:5}
.tri-top .pair{display:flex;gap:14px}
.tri-dot{width:51px;height:51px;border:0;border-radius:50%;background:#d6d6d6;cursor:pointer}
.tri-top .pair:last-child .tri-dot{cursor:default}
.tri-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none}
.tri-center h2{font-size:43px;line-height:1.72;font-weight:700;letter-spacing:-.045em;margin:0;white-space:pre-line}
.tri-center .quiz-pill{pointer-events:auto;margin-top:39px}
#learnIntro{z-index:32;opacity:0;transition:opacity .55s ease}
#learnIntro.visible{opacity:1}
#learnIntro.fade-out{opacity:0}
#tryIntro{z-index:32}
.tri-reveal{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;z-index:1}
#quizResult{z-index:22}
.result-layout{position:absolute;left:148px;right:154px;top:177px;bottom:93px;display:grid;grid-template-columns:700px 1fr;gap:95px}
.result-answers{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:18px 24px}
.result-item{display:flex;align-items:center;gap:22px;min-width:0}
.result-photo{width:155px;height:94px;flex:none;object-fit:cover;background:#dadada}
.result-caption{font-size:20px;font-weight:700;color:#ff00b7;white-space:nowrap}
.result-number{font-size:13px;color:#999;display:block;margin-bottom:3px}
.result-score-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.score-ball{width:335px;height:335px;border-radius:50%;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 48% 12%,#f7c5f8 0%,#b1ead5 29%,#26a5ef 60%,#88e3e4 84%,#f1c7e7 100%);box-shadow:inset 0 8px 25px #fff9,inset 0 -12px 22px #8a78ce66,0 2px 7px #9993}
.score-ball::before{content:'';position:absolute;inset:-35%;background:radial-gradient(ellipse at 26% 35%,#ffb5ecaa,transparent 35%),radial-gradient(ellipse at 64% 65%,#0489f9cc,transparent 45%),radial-gradient(ellipse at 30% 78%,#5ee5d9bb,transparent 45%);filter:blur(25px);animation:gel-drift 7s ease-in-out infinite alternate}
.score-ball::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% -5%,#fff9,transparent 45%),radial-gradient(ellipse at 50% 115%,#fff9,transparent 30%);box-shadow:inset 0 0 0 4px #fff6;pointer-events:none}
.score-label{position:absolute;z-index:2;left:50%;top:36%;transform:translateX(-50%);border-radius:50%;background:#ff00b7;color:#fff;min-width:114px;height:114px;display:flex;align-items:center;justify-content:center;font:700 68px 'Anton',Arial,sans-serif}
@keyframes gel-drift{0%{transform:translate(-8%,5%) rotate(0deg) scale(1)}50%{transform:translate(8%,-5%) rotate(85deg) scale(1.1)}100%{transform:translate(-2%,6%) rotate(170deg) scale(1.04)}}
.result-score-area h2{font-size:43px;color:#ff00b7;margin:0 0 16px}
.result-score-area .quiz-pill{color:#ff00b7}
#tryCamera{z-index:38;background:#fff}
#tryVideo,#tryOverlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#tryOverlay{pointer-events:none}
.try-camera-controls{position:absolute;right:68px;top:150px;z-index:5;display:flex;flex-direction:column;gap:23px}
.try-filter{width:114px;height:114px;border:0;border-radius:50%;background:#d7d7d7e8;display:grid;place-items:center;cursor:pointer;position:relative;color:#fff;transition:background .2s,transform .2s}
.try-filter:hover,.try-filter:focus-visible{background:#fff;transform:scale(1.045);color:#111}
.try-filter.selected{box-shadow:0 0 0 3px #ff00b7}
.try-filter .filter-name{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#111;font-weight:700;font-size:26px;opacity:0;transition:opacity .2s;background:#d7d7d7}
.try-filter:hover .filter-name,.try-filter:focus-visible .filter-name{opacity:1}
.try-filter svg{width:70px;height:70px}
.camera-top{position:absolute;left:40px;top:34px;z-index:6;display:flex;gap:14px}
.camera-bottom{position:absolute;left:50%;bottom:45px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:20px}
.camera-capture{width:76px;height:76px;border-radius:50%;border:6px solid #fff;background:#ffffffa8;box-shadow:0 0 0 2px #7778;cursor:pointer}
.camera-status{position:absolute;bottom:32px;left:40px;background:#ffffffd9;border-radius:24px;padding:10px 18px;color:#333;font-size:16px;z-index:5;max-width:440px}
.camera-intensity{position:absolute;right:40px;bottom:35px;z-index:5;background:#ffffffe6;border-radius:24px;padding:10px 16px;display:flex;gap:12px;align-items:center;font-weight:700}
.camera-intensity input{width:150px;accent-color:#ff00b7}
@media(prefers-reduced-motion:reduce){.score-ball::before{animation:none}}

/* Submission-ready simplified visuals */
#cityOrb{cursor:default}#cityOrb canvas{border-radius:50%}
.orb-help{visibility:hidden}
#quizPhoto{object-fit:cover}
#quizImageState{background:#e6e6e6}
.learn-controls button svg,.quiz-top-left button svg,.tri-top button svg,.camera-top button svg{width:25px;height:25px;stroke:#222;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.learn-controls button,.quiz-top-left button,.tri-top button,.camera-top button{display:grid;place-items:center}

/* TRI final polish: white canvas, black typography, circular iridescent orb */
.result-caption,.result-score-area h2,.result-score-area .quiz-pill,.score-label{color:#111!important}
.score-label{background:rgba(255,255,255,.55)!important;box-shadow:0 1px 15px #ffffff70;color:#111!important}
.score-ball{background:radial-gradient(ellipse at 45% 20%,#f9d7f8 0%,#b9e8df 28%,#47b7ee 63%,#9ce5ed 85%,#f4d5f1 100%);box-shadow:inset 0 10px 24px #fff9,inset 0 -12px 28px #8790d65c,0 2px 8px #9c9c9c44}
.score-ball::before{border-radius:50%}
.result-score-area{background:transparent!important}
#quizResult,.result-layout,.result-score-area{background:#fff0!important}
.tri-back svg{width:25px;height:25px;stroke:#222;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tri-back{display:grid;place-items:center}
#quizResult .result-score-area h2{color:#111!important}
#quizResult .score-ball{flex:none}
/* remove neon pink in text throughout the site without affecting image effects */
.quiz-choices,.quiz-choices label,.quiz-question,.quiz-pill,.result-caption,.tri-center h2,.filter-name,.country-title,.country-copy,.learn-copy,.menu-circle .word{color:#111!important}
#quizResult .result-score-area .quiz-pill{color:#111!important}
#cityOrb,#modalOrb{border-radius:50%;overflow:hidden}
#cityOrb canvas,#modalOrb canvas{border-radius:50%}
/* no rectangle behind the score orb */
#quizResult .score-ball{background-clip:padding-box}
.audio-toggle{position:fixed;right:20px;bottom:18px;z-index:100;border:1px solid #dedede;background:#fffdfdec;color:#111;border-radius:22px;padding:8px 13px;font:600 12px Arial,sans-serif;cursor:pointer}

/* Final isolation: hide quiz completely beneath results; only one nav pair. */
#quizPage:not(.visible){display:none!important}
#quizResult.visible{display:block!important;background:#fff!important;z-index:70!important;isolation:isolate}
#quizResult .tri-top{z-index:80}
#quizResult .tri-top .pair{gap:14px}
#quizResult .result-layout{z-index:1}
#quizResult .score-ball{overflow:hidden!important;clip-path:circle(50% at 50% 50%);-webkit-clip-path:circle(50% at 50% 50%);background:radial-gradient(ellipse at 26% 18%,#ffe5f8 0%,#e5e1fb 23%,#a8eae7 47%,#4ebcf5 68%,#c5d4ff 85%,#fce8fc 100%)!important;box-shadow:inset 0 8px 22px #fff9,inset 0 -10px 25px #a7a1d577!important}
#quizResult .score-ball::before{inset:-30%;border-radius:50%;background:radial-gradient(ellipse at 18% 32%,#f8c5f9b9,transparent 40%),radial-gradient(ellipse at 70% 56%,#009df3cc,transparent 48%),radial-gradient(ellipse at 25% 78%,#87f9e9d1,transparent 44%);filter:blur(24px);animation:gel-drift 7s ease-in-out infinite alternate}
#quizResult .score-ball::after{box-shadow:inset 0 0 0 3px #fff8,inset 0 12px 24px #fff7!important}
#quizResult .score-label{background:transparent!important;box-shadow:none!important;color:#080808!important;top:50%;left:50%;transform:translate(-50%,-50%);font-size:92px}
#quizResult .result-caption,#quizResult .result-score-area h2,#quizResult .result-score-area button{color:#111!important}
#quizResult .result-score-area{background:transparent!important}

/* Final interactive polish: ambient cursor ripples, no layout changes */
#learnPage,#quizResult{isolation:isolate}
.tri-ambient{position:absolute;inset:0;width:1600px;height:900px;z-index:0;pointer-events:none;opacity:.78}
#learnPage .learn-controls,#learnPage .learn-title,#learnPage .learn-grid,#learnPage .country-arrow,#learnPage #sphereModal{z-index:2}
#learnPage .learn-controls,#learnPage .learn-title,#learnPage .learn-grid{position:absolute}
#quizResult .result-layout{z-index:2}
#quizResult .tri-top{z-index:5}
#quizResult .score-ball{cursor:pointer;transition:transform 1.35s cubic-bezier(.2,.72,.19,1),box-shadow .35s ease;will-change:transform}
#quizResult .score-ball:hover{transform:rotate(360deg) scale(1.045);box-shadow:inset 0 8px 22px #fff9,inset 0 -10px 25px #a7a1d577,0 8px 30px #87baf866!important}
#quizResult .score-ball .score-label{transition:transform 1.35s cubic-bezier(.2,.72,.19,1)}
#quizResult .score-ball:hover .score-label{transform:translate(-50%,-50%) rotate(-360deg)}
@media(prefers-reduced-motion:reduce){#quizResult .score-ball,#quizResult .score-ball .score-label{transition:none}}
</style>
</head>
<body>
<div class="viewport"><main class="home" aria-label="TRI:CULTURE 홈 화면">
<canvas id="mapCanvas" aria-hidden="true"></canvas><div class="soft-light" aria-hidden="true"></div>
<h1 class="brand"><span>TRI</span><span>:CULTURE</span></h1>
<nav class="menu" aria-label="메인 메뉴">
<button type="button" class="menu-circle learn" aria-label="LEARN"><span class="number">1</span><span class="word">LEARN</span></button>
<button type="button" class="menu-circle quiz" aria-label="QUIZ"><span class="number">2</span><span class="word">QUIZ</span></button>
<button type="button" class="menu-circle try" aria-label="TRY"><span class="number">3</span><span class="word">TRY</span></button>
</nav>

<section id="learnPage" aria-label="나라별 소개"><canvas class="tri-ambient" id="learnAmbient" width="1600" height="900" aria-hidden="true"></canvas>
 <div class="learn-controls"><button id="backHome" title="홈으로" aria-label="홈으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9 21v-7h6v7"/></svg></button><button id="backHome2" title="홈으로 돌아가기" aria-label="뒤로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 4-8 8 8 8M7 12h14"/></svg></button></div>
 <h2 class="learn-title" id="countryTitle">ABOUT KOREA</h2>
 <button class="country-arrow prev" id="countryPrev" aria-label="이전 나라"></button>
 <button class="country-arrow next" id="countryNext" aria-label="다음 나라"></button>
 <div class="learn-grid"><div>
   <button class="city-orb" id="cityOrb" aria-label="수도 파노라마, 마우스로 움직이고 클릭하면 확대"><canvas width="570" height="570"></canvas></button>
   <div class="orb-help">MOVE TO EXPLORE · CLICK TO ENLARGE</div>
 </div><div class="learn-copy" id="countryCopy"></div></div>
 <div id="sphereModal" role="dialog" aria-modal="true" aria-label="확대된 수도 전경">
  <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
  <div class="city-orb" id="modalOrb"><canvas width="710" height="710"></canvas></div>
  <div class="modal-label">MOVE YOUR MOUSE TO EXPLORE · ESC TO CLOSE</div>
 </div>

  <script>
// 1600 × 900 고정 레이아웃. 브라우저 크기가 달라져도 요소 사이의 비율과 위치는 유지됩니다.
const stage=document.querySelector('.home');
function fitStage(){const factor=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(${(innerWidth-1600*factor)/2}px,${(innerHeight-900*factor)/2}px) scale(${factor})`;}
addEventListener('resize',fitStage);fitStage();
const canvas=document.querySelector('#mapCanvas'),ctx=canvas.getContext('2d');
const pointer={x:-9999,y:-9999,active:false};
const dots=LAND_DOTS.map(([nx,ny])=>({nx,ny,heat:0}));
let last=0;
function sizeCanvas(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=1600*dpr;canvas.height=900*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
sizeCanvas();
addEventListener('pointermove',e=>{const b=stage.getBoundingClientRect();const factor=b.width/1600;pointer.x=(e.clientX-b.left)/factor;pointer.y=(e.clientY-b.top)/factor;pointer.active=true},{passive:true});
addEventListener('pointerout',e=>{if(!e.relatedTarget)pointer.active=false});addEventListener('blur',()=>pointer.active=false);
const blue=[6,130,255],yellow=[255,238,0],pink=[255,0,187],deepPink=[198,0,125];
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function draw(time){const dt=Math.min((time-last)/16.667||1,3);last=time;ctx.clearRect(0,0,1600,900);
for(const d of dots){
// 지도는 원래보다 확대하고 왼쪽/위쪽으로 이동시켜 러프 스케치의 크롭을 반영합니다.
const x=d.nx*1890-65,y=d.ny*1030-45;
let target=0;if(pointer.active){const distance=Math.hypot(x-pointer.x,y-pointer.y);if(distance<155)target=Math.pow(1-distance/155,1.12)}
d.heat+=(target-d.heat)*Math.min(1,(target>d.heat?.24:.055)*dt);
const h=d.heat;const r=3.2+h*11.5;
let rgb=h<.42?mix(blue,yellow,h/.42):h<.82?mix(yellow,pink,(h-.42)/.4):mix(pink,deepPink,(h-.82)/.18);
ctx.fillStyle=`rgb(${rgb.join(',')})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
if(h>.8){ctx.fillStyle=`rgba(165,0,102,${(h-.8)*2.8})`;ctx.beginPath();ctx.arc(x,y,r*.42,0,Math.PI*2);ctx.fill()}
}
requestAnimationFrame(draw)}requestAnimationFrame(draw);

<script>
/* Audio uses the Web Audio API: no external files and no network needed. */
(()=>{
let ac=null,master=null,musicTimer=null,musicEnabled=false;
const AudioCtx=window.AudioContext||window.webkitAudioContext;
function init(){if(!AudioCtx)return false;if(!ac){ac=new AudioCtx();master=ac.createGain();master.gain.value=.16;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume().catch(()=>{});return true}
function note(freq,duration,kind='sine',volume=.12,delay=0){if(!ac)return;const t=ac.currentTime+delay;const o=ac.createOscillator(),g=ac.createGain();o.type=kind;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,volume),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(master);o.start(t);o.stop(t+duration+.03)}
function hover(){if(!init())return;note(680,.13,'sine',.085);note(1020,.18,'sine',.035,.045)}
function click(){if(!init())return;note(520,.15,'sine',.11);note(800,.22,'sine',.08,.07);note(1190,.29,'sine',.025,.12)}
let lastHover=null;document.addEventListener('pointerover',e=>{const el=e.target.closest('button,.menu-circle,.country-arrow');if(!el||el===lastHover)return;lastHover=el;if(ac&&ac.state==='running')hover()});

document.addEventListener('click',e=>{if(e.target.closest('button,.menu-circle,.country-arrow'))click()},true);
const musicButton=document.createElement('button');musicButton.className='audio-toggle';musicButton.textContent='♪ BGM OFF';musicButton.setAttribute('aria-label','배경 음악 켜기 또는 끄기');document.body.appendChild(musicButton);
let seq=0;const melody=[392,493.88,587.33,493.88,349.23,440,523.25,440,329.63,392,493.88,392,293.66,369.99,440,369.99];
function tick(){if(!musicEnabled||!ac)return;const i=seq++%melody.length;note(melody[i],.85,'sine',.035);if(i%4===0)note(melody[i]/2,1.8,'sine',.023);}
musicButton.onclick=()=>{if(!init()){musicButton.textContent='음악 지원 안 됨';return}musicEnabled=!musicEnabled;musicButton.textContent=musicEnabled?'♪ BGM ON':'♪ BGM OFF';if(musicEnabled){tick();musicTimer=setInterval(tick,900)}else{clearInterval(musicTimer);musicTimer=null}};

<script>
/* Lightweight interactive particles for LEARN and the score screen. */
(()=>{
 function attach(id,canvasId,active){
  const host=document.getElementById(id),canvas=document.getElementById(canvasId);
  if(!host||!canvas)return;
  const ctx=canvas.getContext('2d');
  let pointer={x:-999,y:-999,on:false},particles=[];
  host.addEventListener('pointermove',e=>{
   const rect=host.getBoundingClientRect();
   pointer.x=(e.clientX-rect.left)*1600/rect.width;
   pointer.y=(e.clientY-rect.top)*900/rect.height;
   pointer.on=true;
   if(particles.length<85 && Math.random()<.52){
    particles.push({x:pointer.x+(Math.random()-.5)*28,y:pointer.y+(Math.random()-.5)*28,r:1.5+Math.random()*3,life:1,vx:(Math.random()-.5)*1.5,vy:-.3-Math.random()*1.1});
   }
  });
  host.addEventListener('pointerleave',()=>pointer.on=false);
  function tick(){
   ctx.clearRect(0,0,1600,900);
   if(active()){
    if(pointer.on){
     for(let ring=0;ring<3;ring++){
      const radius=22+ring*24;
      ctx.beginPath();ctx.arc(pointer.x,pointer.y,radius,0,Math.PI*2);
      ctx.strokeStyle=`rgba(73,166,218,${.12-ring*.028})`;ctx.lineWidth=1.2;ctx.stroke();
     }
    }
    for(const p of particles){
     p.x+=p.vx;p.y+=p.vy;p.life-=.018;
     ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.1,p.r*p.life),0,Math.PI*2);
     ctx.fillStyle=`rgba(94,181,222,${Math.max(0,p.life)*.55})`;ctx.fill();
    }
    particles=particles.filter(p=>p.life>0);
   }else{particles=[];pointer.on=false}
   requestAnimationFrame(tick);
  }
  tick();
 }
 attach('learnPage','learnAmbient',()=>document.getElementById('learnPage').classList.contains('is-visible'));
 attach('quizResult','resultAmbient',()=>document.getElementById('quizResult').classList.contains('visible'));
})();
</script>
